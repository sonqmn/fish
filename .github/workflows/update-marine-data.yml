name: Update live marine observations
on:
  workflow_dispatch:
  schedule:
    - cron: '15 * * * *'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Fetch official marine observation
        env:
          MARINE_WEATHER_API_KEY: ${{ secrets.MARINE_WEATHER_API_KEY }}
        run: python scripts/fetch_marine_data.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest.json
          git diff --cached --quiet || git commit -m "chore: update live marine observation"
          git push
