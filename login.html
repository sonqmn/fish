<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>바다온 로그인</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="login-page">
    <main class="login-gate">
      <div class="login-sea">〰︎</div>
      <div class="login-content">
        <div class="login-logo"><span>🌊</span><b>바다온</b></div>
        <p class="login-kicker">수산 안전 통합 알림</p>
        <h1>우리 바다와<br /><strong>양식장을 지켜요.</strong></h1>
        <p class="login-description">회원은 내 양식장 맞춤 환경 정보와<br />위험 알림을 확인할 수 있습니다.</p>
        <div class="login-tabs"><button type="button" class="login-tab active" data-login-type="member">회원</button><button type="button" class="login-tab" data-login-type="guest">비회원</button></div>
        <form id="member-login" class="login-form"><label>아이디<input id="login-id" required autocomplete="username" placeholder="아이디를 입력하세요" /></label><label>비밀번호<input type="password" required autocomplete="current-password" placeholder="비밀번호를 입력하세요" /></label><button class="primary-button" type="submit">로그인하고 시작하기</button><button class="join-link" type="button">아직 회원이 아니신가요? <b>회원가입</b></button></form>
        <section id="guest-login" class="guest-login hidden"><p>로그인 없이 주요 정보를 확인할 수 있어요.<br />개인 양식장 맞춤 알림은 회원 로그인 후 이용 가능합니다.</p><button id="guest-enter" class="outline-button" type="button">비회원으로 둘러보기</button></section>
      </div>
    </main>
    <script src="login.js"></script>
  </body>
</html>
